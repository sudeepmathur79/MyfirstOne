<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chess Tutor</title>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #1c1c1e;
      --surface:  #2c2c2e;
      --surface2: #3a3a3c;
      --accent:   #0a84ff;
      --green:    #30d158;
      --red:      #ff453a;
      --yellow:   #ffd60a;
      --text:     #ffffff;
      --subtext:  #ebebf5cc;
      --radius:   14px;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 12px 40px;
      min-height: 100dvh;
      gap: 12px;
    }

    header {
      width: 100%; max-width: 390px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .app-title { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }

    .turn-pill {
      font-size: 13px; font-weight: 600;
      padding: 5px 12px; border-radius: 20px;
      background: var(--surface2); color: var(--subtext);
      transition: background 0.25s, color 0.25s;
    }
    .turn-pill.white  { background: #f0d9b5; color: #1c1c1e; }
    .turn-pill.black  { background: #b58863; color: #fff; }
    .turn-pill.cpu    { background: #3a3a3c; color: var(--yellow); }

    #tutor-feedback {
      width: 100%; max-width: 390px; min-height: 54px;
      display: flex; align-items: center; justify-content: center;
      padding: 10px 16px;
      border-radius: var(--radius); background: var(--surface);
      font-size: 15px; font-weight: 600; line-height: 1.35; text-align: center;
      border: 1.5px solid var(--surface2);
      transition: background 0.25s, color 0.25s, border-color 0.25s;
    }
    #tutor-feedback.state-neutral { color: var(--subtext); }
    #tutor-feedback.state-ok      { color: var(--green);  border-color: rgba(48,209,88,0.4);  background: rgba(48,209,88,0.1); }
    #tutor-feedback.state-blunder { color: var(--red);    border-color: rgba(255,69,58,0.5);  background: rgba(255,69,58,0.12); animation: shake 0.45s ease; }
    #tutor-feedback.state-check   { color: var(--yellow); border-color: rgba(255,214,10,0.5); background: rgba(255,214,10,0.1); }
    #tutor-feedback.state-cpu     { color: var(--yellow); border-color: rgba(255,214,10,0.3); background: rgba(255,214,10,0.06); }
    #tutor-feedback.state-end     { color: var(--accent); border-color: rgba(10,132,255,0.4); background: rgba(10,132,255,0.1); }

    @keyframes shake {
      0%,100%{ transform:translateX(0); }
      20%    { transform:translateX(-5px); }
      40%    { transform:translateX(5px); }
      60%    { transform:translateX(-4px); }
      80%    { transform:translateX(4px); }
    }

    /* No fixed height — chessboard.js controls it; overflow:hidden was clipping ranks */
    #board-wrapper {
      border-radius: var(--radius);
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      line-height: 0;
    }
    #board {
      width: 85vw !important;
      max-width: 350px !important;
    }

    /* Tap-to-move highlights */
    #board .sq-sel     { background: rgba(255,214,10,0.7)  !important; }
    #board .sq-move    { background: rgba(48,209,88,0.55)  !important; }
    #board .sq-capture { background: rgba(255,69,58,0.6)   !important; }
    #board .square-55d63 { transition: background 0.08s; }

    #captured-wrap { width: 100%; max-width: 390px; display: flex; gap: 8px; }
    .captured-side {
      flex: 1; background: var(--surface);
      border-radius: 10px; padding: 6px 10px;
      border: 1px solid var(--surface2);
    }
    .cap-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.7px;
      text-transform: uppercase; color: var(--subtext); margin-bottom: 2px;
    }
    .cap-pieces { font-size: 17px; line-height: 1.3; min-height: 22px; }

    #move-log-wrap {
      width: 100%; max-width: 390px;
      background: var(--surface); border-radius: var(--radius);
      padding: 10px 14px; border: 1px solid var(--surface2);
    }
    .log-header {
      font-size: 11px; font-weight: 700; letter-spacing: 0.8px;
      text-transform: uppercase; color: var(--subtext); margin-bottom: 6px;
    }
    #move-log {
      display: flex; flex-wrap: wrap; gap: 3px 6px;
      max-height: 56px; overflow-y: auto;
      font-size: 13px; font-variant-numeric: tabular-nums;
    }
    #move-log::-webkit-scrollbar { width: 3px; }
    #move-log::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 4px; }
    .log-pair { display: flex; gap: 3px; align-items: baseline; }
    .log-num  { color: var(--subtext); font-size: 11px; }
    .log-w    { color: var(--text); }
    .log-b    { color: #b58863; }

    .btn-row { width: 100%; max-width: 390px; display: flex; gap: 10px; }
    button {
      flex: 1; height: 52px; border: none;
      border-radius: var(--radius); font-size: 16px; font-weight: 700;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s, transform 0.1s;
    }
    button:active { transform: scale(0.96); opacity: 0.82; }
    #btn-takeback { background: var(--surface2); color: var(--text); }
    #btn-new      { background: var(--accent);   color: #fff; }
  </style>
</head>
<body>

<header>
  <span class="app-title">Chess Tutor</span>
  <span class="turn-pill white" id="turn-pill">Your turn</span>
</header>

<div id="tutor-feedback" class="state-neutral">
  You play White. Tap a piece, then tap where to move.
</div>

<div id="board-wrapper">
  <div id="board"></div>
</div>

<div id="captured-wrap">
  <div class="captured-side">
    <div class="cap-label">You captured</div>
    <div class="cap-pieces" id="cap-white"></div>
  </div>
  <div class="captured-side">
    <div class="cap-label">Computer captured</div>
    <div class="cap-pieces" id="cap-black"></div>
  </div>
</div>

<div id="move-log-wrap">
  <div class="log-header">Move History</div>
  <div id="move-log"></div>
</div>

<div class="btn-row">
  <button id="btn-takeback" onclick="undoLastMove()">&#8630; Take Back</button>
  <button id="btn-new"      onclick="newGame()">New Game</button>
</div>

<script>
// ─────────────────────────────────────────────
//  Constants
// ─────────────────────────────────────────────
const PIECE_SCORES = { p:100, n:320, b:330, r:500, q:900, k:20000 };
const CPU_DEPTH    = 2;   // minimax depth (2 = looks 2 half-moves ahead, fast on mobile)

// Piece-square tables — from White's perspective, rank 8 first, files a→h.
// Black pieces mirror vertically (rank flipped).
const PST = {
  p: [
     0,  0,  0,  0,  0,  0,  0,  0,  // rank 8
    50, 50, 50, 50, 50, 50, 50, 50,  // rank 7
    10, 10, 20, 30, 30, 20, 10, 10,  // rank 6
     5,  5, 10, 25, 25, 10,  5,  5,  // rank 5
     0,  0,  0, 20, 20,  0,  0,  0,  // rank 4
     5, -5,-10,  0,  0,-10, -5,  5,  // rank 3
     5, 10, 10,-20,-20, 10, 10,  5,  // rank 2 (central pawns penalised to encourage push)
     0,  0,  0,  0,  0,  0,  0,  0   // rank 1
  ],
  n: [
    -50,-40,-30,-30,-30,-30,-40,-50,
    -40,-20,  0,  0,  0,  0,-20,-40,
    -30,  0, 10, 15, 15, 10,  0,-30,
    -30,  5, 15, 20, 20, 15,  5,-30,
    -30,  0, 15, 20, 20, 15,  0,-30,
    -30,  5, 10, 15, 15, 10,  5,-30,
    -40,-20,  0,  5,  5,  0,-20,-40,
    -50,-40,-30,-30,-30,-30,-40,-50
  ],
  b: [
    -20,-10,-10,-10,-10,-10,-10,-20,
    -10,  0,  0,  0,  0,  0,  0,-10,
    -10,  0,  5, 10, 10,  5,  0,-10,
    -10,  5,  5, 10, 10,  5,  5,-10,
    -10,  0, 10, 10, 10, 10,  0,-10,
    -10, 10, 10, 10, 10, 10, 10,-10,
    -10,  5,  0,  0,  0,  0,  5,-10,
    -20,-10,-10,-10,-10,-10,-10,-20
  ],
  r: [
     0,  0,  0,  0,  0,  0,  0,  0,
     5, 10, 10, 10, 10, 10, 10,  5,
    -5,  0,  0,  0,  0,  0,  0, -5,
    -5,  0,  0,  0,  0,  0,  0, -5,
    -5,  0,  0,  0,  0,  0,  0, -5,
    -5,  0,  0,  0,  0,  0,  0, -5,
    -5,  0,  0,  0,  0,  0,  0, -5,
     0,  0,  0,  5,  5,  0,  0,  0
  ],
  q: [
    -20,-10,-10, -5, -5,-10,-10,-20,
    -10,  0,  0,  0,  0,  0,  0,-10,
    -10,  0,  5,  5,  5,  5,  0,-10,
     -5,  0,  5,  5,  5,  5,  0, -5,
      0,  0,  5,  5,  5,  5,  0, -5,
    -10,  5,  5,  5,  5,  5,  0,-10,
    -10,  0,  5,  0,  0,  0,  0,-10,
    -20,-10,-10, -5, -5,-10,-10,-20
  ],
  k: [
    -30,-40,-40,-50,-50,-40,-40,-30,
    -30,-40,-40,-50,-50,-40,-40,-30,
    -30,-40,-40,-50,-50,-40,-40,-30,
    -30,-40,-40,-50,-50,-40,-40,-30,
    -20,-30,-30,-40,-40,-30,-30,-20,
    -10,-20,-20,-20,-20,-20,-20,-10,
     20, 20,  0,  0,  0,  0, 20, 20,
     20, 30, 10,  0,  0, 10, 30, 20
  ]
};

const GLYPHS = {
  wP:'♙',wN:'♘',wB:'♗',wR:'♖',wQ:'♕',wK:'♔',
  bP:'♟',bN:'♞',bB:'♝',bR:'♜',bQ:'♛',bK:'♚'
};

// ─────────────────────────────────────────────
//  State
// ─────────────────────────────────────────────
let game        = new Chess();
let board;
let selSq       = null;
let legalDst    = [];
let cpuThinking = false;

// ─────────────────────────────────────────────
//  Square highlights
// ─────────────────────────────────────────────
function clearHL() {
  $('#board .square-55d63').removeClass('sq-sel sq-move sq-capture');
}

function highlightFrom(sq) {
  selSq    = sq;
  legalDst = game.moves({ square: sq, verbose: true });
  clearHL();
  $(`#board [data-square="${sq}"]`).addClass('sq-sel');
  legalDst.forEach(m => {
    $(`#board [data-square="${m.to}"]`).addClass(game.get(m.to) ? 'sq-capture' : 'sq-move');
  });
}

// ─────────────────────────────────────────────
//  Evaluation & Minimax
// ─────────────────────────────────────────────
function pstIndex(r, f, isWhite) {
  // r = board row (0=rank8, 7=rank1), f = file (0=a, 7=h)
  return isWhite ? r * 8 + f : (7 - r) * 8 + f;
}

function evaluate() {
  if (game.in_checkmate()) return game.turn() === 'w' ? -99999 : 99999;
  if (game.in_draw())      return 0;

  let score = 0;
  const b   = game.board();
  for (let r = 0; r < 8; r++) {
    for (let f = 0; f < 8; f++) {
      const pc = b[r][f];
      if (!pc) continue;
      const isW  = pc.color === 'w';
      const val  = PIECE_SCORES[pc.type] + (PST[pc.type]?.[pstIndex(r, f, isW)] ?? 0);
      score     += isW ? val : -val;
    }
  }
  return score;
}

// Negamax: returns score from current player's perspective (positive = good for them).
function negamax(depth, alpha, beta) {
  if (depth === 0) {
    const raw = evaluate();
    return game.turn() === 'w' ? raw : -raw;
  }

  const moves = game.moves({ verbose: true });
  if (!moves.length) return game.in_check() ? -99999 : 0;

  // MVV-LVA move ordering to improve pruning
  moves.sort((a, b) => {
    const av = a.captured ? PIECE_SCORES[a.captured] * 10 - PIECE_SCORES[a.piece] : 0;
    const bv = b.captured ? PIECE_SCORES[b.captured] * 10 - PIECE_SCORES[b.piece] : 0;
    return bv - av;
  });

  let best = -Infinity;
  for (const m of moves) {
    game.move(m);
    const score = -negamax(depth - 1, -beta, -alpha);
    game.undo();
    if (score > best)  best  = score;
    if (best  > alpha) alpha = best;
    if (alpha >= beta) break;
  }
  return best;
}

function getBestCpuMove() {
  const moves = game.moves({ verbose: true });
  if (!moves.length) return null;

  moves.sort((a, b) => {
    const av = a.captured ? PIECE_SCORES[a.captured] * 10 - PIECE_SCORES[a.piece] : 0;
    const bv = b.captured ? PIECE_SCORES[b.captured] * 10 - PIECE_SCORES[b.piece] : 0;
    return bv - av;
  });

  let bestMove  = moves[0];
  let bestScore = -Infinity;
  let alpha     = -Infinity;

  for (const m of moves) {
    game.move(m);
    const score = -negamax(CPU_DEPTH - 1, -Infinity, -alpha);
    game.undo();
    if (score > bestScore) { bestScore = score; bestMove = m; }
    if (score > alpha)       alpha = score;
  }
  return bestMove;
}

// ─────────────────────────────────────────────
//  Blunder detection (for White's moves)
// ─────────────────────────────────────────────
function evalMove() {
  let worstLoss = 0;
  for (const om of game.moves({ verbose: true })) {
    if (!om.captured) continue;
    const gained = PIECE_SCORES[om.captured];
    const risked = PIECE_SCORES[om.piece];
    const tmp    = new Chess(game.fen());
    tmp.move(om);
    const canRecap = tmp.moves({ verbose: true }).some(r => r.to === om.to && r.captured);
    const net = canRecap ? gained - risked : gained;
    if (net > worstLoss) worstLoss = net;
  }
  return worstLoss >= 2; // minor piece or better hanging = blunder
}

// ─────────────────────────────────────────────
//  CPU move execution
// ─────────────────────────────────────────────
function doCpuMove() {
  if (game.game_over()) { cpuThinking = false; return; }

  const move = getBestCpuMove();
  if (!move) { cpuThinking = false; return; }

  game.move(move);
  board.position(game.fen());
  cpuThinking = false;
  refreshUI();

  if (game.in_checkmate()) {
    setFeedback('🏆 Checkmate! Computer wins. Start a new game!', 'end');
  } else if (game.in_draw()) {
    setFeedback('🤝 Draw! Start a new game.', 'end');
  } else if (game.in_check()) {
    setFeedback(`🤖 Computer played ${move.san} — ⚡ Check! Get your king to safety.`, 'check');
  } else {
    setFeedback(`🤖 Computer played ${move.san}. Your move!`, 'neutral');
  }
}

// ─────────────────────────────────────────────
//  Player move execution
// ─────────────────────────────────────────────
function executeMove(from, to) {
  if (cpuThinking || game.game_over() || game.turn() !== 'w') return false;

  const move = game.move({ from, to, promotion: 'q' });
  if (!move) return false;

  clearHL(); selSq = null; legalDst = [];
  board.position(game.fen());
  refreshUI();

  if (game.in_checkmate()) {
    setFeedback('🏆 Checkmate! You win!', 'end');
    return true;
  }
  if (game.in_draw()) {
    setFeedback('🤝 Draw! Well played.', 'end');
    return true;
  }

  const isBlunder = evalMove();
  let   delay     = 500;

  if (isBlunder) {
    setFeedback('❌ Blunder! Your position dropped. Hit Take Back and try again!', 'blunder');
    delay = 1400; // give the user time to read the warning before computer strikes
  } else if (game.in_check()) {
    setFeedback('⚡ Check! You put the king under attack!', 'check');
    delay = 500;
  } else {
    setFeedback('✅ Good move! Computer is thinking…', 'ok');
    delay = 400;
  }

  cpuThinking = true;
  setTimeout(doCpuMove, delay);
  return true;
}

// ─────────────────────────────────────────────
//  Tap-to-move (event delegation survives DOM rebuilds)
// ─────────────────────────────────────────────
$(document).on('click', '#board [data-square]', function (e) {
  e.stopPropagation();
  if (cpuThinking || game.game_over() || game.turn() !== 'w') return;

  const sq    = $(this).data('square');
  const piece = game.get(sq);

  if (!selSq) {
    if (piece && piece.color === 'w') highlightFrom(sq);
    return;
  }

  if (sq === selSq) { clearHL(); selSq = null; legalDst = []; return; }

  if (legalDst.some(m => m.to === sq)) {
    executeMove(selSq, sq);
    return;
  }

  if (piece && piece.color === 'w') { highlightFrom(sq); return; }

  clearHL(); selSq = null; legalDst = [];
});

// ─────────────────────────────────────────────
//  Drag-and-drop (desktop / power users)
// ─────────────────────────────────────────────
function onDragStart(source, piece) {
  if (cpuThinking || game.game_over() || game.turn() !== 'w') return false;
  if (piece.startsWith('b')) return false;
  highlightFrom(source);
  return true;
}

function onDrop(source, target) {
  clearHL(); selSq = null; legalDst = [];
  if (source === target) return 'snapback';
  return executeMove(source, target) ? undefined : 'snapback';
}

function onSnapEnd() { board.position(game.fen()); }

// ─────────────────────────────────────────────
//  Take Back — undoes White + Black moves together
// ─────────────────────────────────────────────
function undoLastMove() {
  if (cpuThinking || !game.history().length) return;

  // If it's White's turn, the computer already replied — undo Black then White
  if (game.turn() === 'w') game.undo();
  // Now undo White's move (brings us back to White's turn)
  if (game.history().length) game.undo();

  clearHL(); selSq = null; legalDst = [];
  board.position(game.fen());
  refreshUI();

  setFeedback(
    game.history().length
      ? '↩️ Move taken back. Try a different plan!'
      : 'You play White. Tap a piece, then tap where to move.',
    'neutral'
  );
}

// ─────────────────────────────────────────────
//  New Game
// ─────────────────────────────────────────────
function newGame() {
  cpuThinking = false;
  clearHL(); selSq = null; legalDst = [];
  game = new Chess();
  board.start();
  setFeedback('You play White. Tap a piece, then tap where to move.', 'neutral');
  refreshUI();
}

// ─────────────────────────────────────────────
//  UI helpers
// ─────────────────────────────────────────────
function setFeedback(msg, state) {
  const el = document.getElementById('tutor-feedback');
  el.className = '';
  void el.offsetWidth; // restart animation
  el.className   = 'state-' + state;
  el.textContent = msg;
}

function refreshUI() {
  updateTurnPill();
  updateMoveLog();
  updateCaptured();
}

function updateTurnPill() {
  const pill = document.getElementById('turn-pill');
  if (game.game_over())    { pill.textContent = 'Game Over';    pill.className = 'turn-pill'; return; }
  if (cpuThinking)         { pill.textContent = 'CPU thinking'; pill.className = 'turn-pill cpu'; return; }
  const t = game.turn();
  pill.textContent = t === 'w' ? 'Your turn' : 'CPU thinking';
  pill.className   = 'turn-pill ' + (t === 'w' ? 'white' : 'cpu');
}

function updateMoveLog() {
  const hist = game.history();
  const log  = document.getElementById('move-log');
  log.innerHTML = '';
  for (let i = 0; i < hist.length; i += 2) {
    const pair = document.createElement('span');
    pair.className = 'log-pair';
    pair.innerHTML =
      `<span class="log-num">${Math.floor(i/2)+1}.</span>` +
      `<span class="log-w">${hist[i]}</span>` +
      (hist[i+1] ? `<span class="log-b">${hist[i+1]}</span>` : '');
    log.appendChild(pair);
  }
  log.scrollTop = log.scrollHeight;
}

function updateCaptured() {
  const hist = game.history({ verbose: true });
  const wCap = [], bCap = [];
  hist.forEach(m => {
    if (!m.captured) return;
    const key = (m.color === 'w' ? 'b' : 'w') + m.captured.toUpperCase();
    (m.color === 'w' ? wCap : bCap).push(GLYPHS[key] || '');
  });
  document.getElementById('cap-white').textContent = wCap.join('');
  document.getElementById('cap-black').textContent = bCap.join('');
}

// ─────────────────────────────────────────────
//  Board init
// ─────────────────────────────────────────────
$(document).ready(function () {
  board = Chessboard('board', {
    draggable:     true,
    position:      'start',
    onDragStart:   onDragStart,
    onDrop:        onDrop,
    onSnapEnd:     onSnapEnd,
    pieceTheme:    'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
    moveSpeed:     120,
    snapbackSpeed: 250,
    snapSpeed:     80
  });

  $(window).on('resize', function () { board.resize(); });
});
</script>
</body>
</html>
