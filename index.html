<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chess Tutor</title>

  <!-- Chessboard.js CSS -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css" />

  <!-- jQuery -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

  <!-- Chess.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

  <!-- Chessboard.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #1c1c1e;
      --surface:   #2c2c2e;
      --surface2:  #3a3a3c;
      --accent:    #0a84ff;
      --green:     #30d158;
      --red:       #ff453a;
      --yellow:    #ffd60a;
      --text:      #ffffff;
      --subtext:   #ebebf5cc;
      --radius:    14px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 12px 32px;
      min-height: 100dvh;
      gap: 14px;
    }

    /* ── Header ── */
    header {
      width: 100%;
      max-width: 390px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .app-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .turn-pill {
      font-size: 13px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 20px;
      background: var(--surface2);
      color: var(--subtext);
      transition: background 0.25s, color 0.25s;
    }
    .turn-pill.white { background: #f0d9b5; color: #1c1c1e; }
    .turn-pill.black { background: #b58863; color: #ffffff; }

    /* ── Feedback Banner ── */
    #tutor-feedback {
      width: 100%;
      max-width: 390px;
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      border-radius: var(--radius);
      background: var(--surface);
      font-size: 15px;
      font-weight: 600;
      line-height: 1.35;
      text-align: center;
      transition: background 0.3s, color 0.3s;
      border: 1.5px solid transparent;
    }
    #tutor-feedback.state-neutral {
      color: var(--subtext);
      border-color: var(--surface2);
    }
    #tutor-feedback.state-ok {
      color: var(--green);
      border-color: rgba(48,209,88,0.35);
      background: rgba(48,209,88,0.12);
    }
    #tutor-feedback.state-blunder {
      color: var(--red);
      border-color: rgba(255,69,58,0.45);
      background: rgba(255,69,58,0.13);
      animation: pulse-red 0.6s ease;
    }
    #tutor-feedback.state-check {
      color: var(--yellow);
      border-color: rgba(255,214,10,0.45);
      background: rgba(255,214,10,0.11);
    }
    #tutor-feedback.state-end {
      color: var(--accent);
      border-color: rgba(10,132,255,0.4);
      background: rgba(10,132,255,0.12);
    }

    @keyframes pulse-red {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.025); }
      60%  { transform: scale(0.985); }
      100% { transform: scale(1); }
    }

    /* ── Board ── */
    #board-wrapper {
      width: 85vw;
      height: 85vw;
      max-width: 350px;
      max-height: 350px;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.55);
    }

    #board {
      width: 100% !important;
      height: 100% !important;
    }

    /* Force chessboard.js internal img to fill */
    #board .square-55d63 { transition: background 0.15s; }
    #board img { touch-action: none; }

    /* ── Move Log ── */
    #move-log-wrap {
      width: 100%;
      max-width: 390px;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 10px 14px;
      border: 1px solid var(--surface2);
    }

    .log-header {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--subtext);
      margin-bottom: 7px;
    }

    #move-log {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 6px;
      max-height: 60px;
      overflow-y: auto;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    #move-log::-webkit-scrollbar { width: 3px; }
    #move-log::-webkit-scrollbar-track { background: transparent; }
    #move-log::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 4px; }

    .log-pair { display: flex; gap: 3px; align-items: baseline; }
    .log-num  { color: var(--subtext); font-size: 11px; }
    .log-w    { color: var(--text); }
    .log-b    { color: #b58863; }

    /* ── Buttons ── */
    .btn-row {
      width: 100%;
      max-width: 390px;
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      height: 52px;
      border: none;
      border-radius: var(--radius);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { transform: scale(0.96); opacity: 0.85; }

    #btn-takeback {
      background: var(--surface2);
      color: var(--text);
    }

    #btn-new {
      background: var(--accent);
      color: #fff;
    }

    /* ── Captured pieces ── */
    #captured-wrap {
      width: 100%;
      max-width: 390px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .captured-side {
      flex: 1;
      background: var(--surface);
      border-radius: 10px;
      padding: 6px 10px;
      border: 1px solid var(--surface2);
      min-height: 34px;
    }

    .cap-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: var(--subtext);
      margin-bottom: 2px;
    }

    .cap-pieces {
      font-size: 18px;
      line-height: 1.2;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <header>
    <span class="app-title">Chess Tutor</span>
    <span class="turn-pill white" id="turn-pill">White to move</span>
  </header>

  <div id="tutor-feedback" class="state-neutral">
    Make your first move to begin. Drag a piece to play!
  </div>

  <div id="board-wrapper">
    <div id="board"></div>
  </div>

  <div id="captured-wrap">
    <div class="captured-side">
      <div class="cap-label">White captured</div>
      <div class="cap-pieces" id="cap-white"></div>
    </div>
    <div class="captured-side">
      <div class="cap-label">Black captured</div>
      <div class="cap-pieces" id="cap-black"></div>
    </div>
  </div>

  <div id="move-log-wrap">
    <div class="log-header">Move History</div>
    <div id="move-log"></div>
  </div>

  <div class="btn-row">
    <button id="btn-takeback" onclick="undoLastMove()">&#8630; Take Back</button>
    <button id="btn-new" onclick="newGame()">New Game</button>
  </div>

<script>
// ── Piece unicode glyphs for captured display ──
const GLYPHS = {
  wP:'♙', wN:'♘', wB:'♗', wR:'♖', wQ:'♕', wK:'♔',
  bP:'♟', bN:'♞', bB:'♝', bR:'♜', bQ:'♛', bK:'♚'
};

// Piece values for tactical evaluation
const PIECE_VAL = { p:1, n:3, b:3, r:5, q:9, k:0 };

let game = new Chess();
let board;

// ── Tactical evaluation ──
// Returns { isBlunder, reason } after a move has been made (game is already post-move).
function evaluateLastMove(moveObj) {
  const us   = moveObj.color;          // side that just moved
  const them = us === 'w' ? 'b' : 'w';

  // Piece that just moved
  const movedPiece  = moveObj.piece;
  const capturedPiece = moveObj.captured;
  const toSq = moveObj.to;

  // ── 1. Simple hanging-piece check ──
  // After our move, does the opponent now have an immediate winning capture?
  const opponentMoves = game.moves({ verbose: true });
  let worstLoss = 0;
  let blunderCapture = null;

  for (const om of opponentMoves) {
    if (!om.captured) continue;
    const gained  = PIECE_VAL[om.captured];
    const risked  = PIECE_VAL[om.piece];

    // Net gain: opponent captures our piece and the square is undefended
    // Quick check: see if we can recapture
    const tempGame = new Chess(game.fen());
    tempGame.move(om);
    const recaps = tempGame.moves({ verbose: true }).filter(
      m => m.to === om.to && m.captured
    );

    let netGain;
    if (recaps.length === 0) {
      // Can't recapture – they win the piece outright
      netGain = gained;
    } else {
      // Best recapture value we can get back
      const bestRecap = Math.max(...recaps.map(r => PIECE_VAL[r.captured || 'p']));
      netGain = gained - risked;
      if (netGain <= 0) continue;
    }

    if (netGain > worstLoss) {
      worstLoss = netGain;
      blunderCapture = om;
    }
  }

  if (worstLoss >= 2) {
    // Minor piece or better is hanging
    return {
      isBlunder: true,
      reason: `❌ Blunder! Your position dropped. Hit Take Back and try again!`
    };
  }

  // ── 2. Moved into check (game.in_check means WE put opponent in check — good)
  if (game.in_check()) {
    return { isBlunder: false, reason: null }; // handled by caller
  }

  return { isBlunder: false, reason: null };
}

// ── Move validation callback ──
function onDrop(source, target) {
  const move = game.move({ from: source, to: target, promotion: 'q' });

  if (move === null) return 'snapback';

  // Post-move state checks
  if (game.in_checkmate()) {
    const winner = move.color === 'w' ? 'White' : 'Black';
    setFeedback(`🏆 Checkmate! ${winner} wins!`, 'end');
    updateUI(move);
    return;
  }

  if (game.in_draw()) {
    let reason = 'Draw';
    if (game.in_stalemate())         reason = 'Stalemate';
    else if (game.in_threefold_repetition()) reason = 'Threefold Repetition';
    else if (game.insufficient_material())   reason = 'Insufficient Material';
    setFeedback(`🤝 ${reason} — the game is a draw.`, 'end');
    updateUI(move);
    return;
  }

  const { isBlunder, reason } = evaluateLastMove(move);

  if (isBlunder) {
    setFeedback(reason, 'blunder');
  } else if (game.in_check()) {
    setFeedback('⚡ Check! The king is under attack.', 'check');
  } else {
    setFeedback('✅ Move validated. Keep going.', 'ok');
  }

  updateUI(move);
}

function onSnapEnd() {
  board.position(game.fen());
}

// ── UI helpers ──
function setFeedback(msg, state) {
  const el = document.getElementById('tutor-feedback');
  el.className = 'state-' + state;
  // Force reflow to restart animation on repeated blunders
  void el.offsetWidth;
  el.className = 'state-' + state;
  el.textContent = msg;
}

function updateUI(lastMove) {
  board.position(game.fen());
  updateTurnPill();
  updateMoveLog();
  updateCaptured();
}

function updateTurnPill() {
  const pill = document.getElementById('turn-pill');
  if (game.game_over()) {
    pill.textContent = 'Game Over';
    pill.className = 'turn-pill';
    return;
  }
  const turn = game.turn();
  pill.textContent = turn === 'w' ? 'White to move' : 'Black to move';
  pill.className = 'turn-pill ' + (turn === 'w' ? 'white' : 'black');
}

function updateMoveLog() {
  const history = game.history({ verbose: false });
  const log = document.getElementById('move-log');
  log.innerHTML = '';

  for (let i = 0; i < history.length; i += 2) {
    const pair = document.createElement('span');
    pair.className = 'log-pair';
    const num = Math.floor(i / 2) + 1;
    pair.innerHTML =
      `<span class="log-num">${num}.</span>` +
      `<span class="log-w">${history[i]}</span>` +
      (history[i+1] ? `<span class="log-b">${history[i+1]}</span>` : '');
    log.appendChild(pair);
  }

  log.scrollLeft = log.scrollWidth;
  log.scrollTop  = log.scrollHeight;
}

function updateCaptured() {
  const history = game.history({ verbose: true });
  const whiteCaptured = []; // pieces captured BY white (black pieces taken)
  const blackCaptured = []; // pieces captured BY black (white pieces taken)

  for (const m of history) {
    if (!m.captured) continue;
    const pieceKey = (m.color === 'w' ? 'b' : 'w') + m.captured.toUpperCase();
    if (m.color === 'w') whiteCaptured.push(GLYPHS[pieceKey] || '');
    else                 blackCaptured.push(GLYPHS[pieceKey] || '');
  }

  document.getElementById('cap-white').textContent = whiteCaptured.join('');
  document.getElementById('cap-black').textContent = blackCaptured.join('');
}

// ── Take Back ──
function undoLastMove() {
  if (game.history().length === 0) return;

  game.undo();
  board.position(game.fen());
  updateTurnPill();
  updateMoveLog();
  updateCaptured();

  if (game.history().length === 0) {
    setFeedback('Make your first move to begin. Drag a piece to play!', 'neutral');
  } else {
    setFeedback('↩️ Move taken back. Try a different plan.', 'neutral');
  }
}

// ── New Game ──
function newGame() {
  game = new Chess();
  board.start();
  setFeedback('Make your first move to begin. Drag a piece to play!', 'neutral');
  updateTurnPill();
  updateMoveLog();
  updateCaptured();
}

// ── Board init ──
$(document).ready(function () {
  const cfg = {
    draggable:     true,
    position:      'start',
    onDrop:        onDrop,
    onSnapEnd:     onSnapEnd,
    pieceTheme:    'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
    moveSpeed:     150,
    snapbackSpeed: 300,
    snapSpeed:     100
  };

  board = Chessboard('board', cfg);

  // Fit board to container on resize
  $(window).resize(function () {
    board.resize();
  });
});
</script>
</body>
</html>
